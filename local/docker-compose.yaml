services:
  postgres:
    image: postgres:17
    container_name: booking_system_db
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_system"]
      interval: 30s
      timeout: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: booking_system_mailpit
    ports:
      - "1025:1025" # SMTP — the app sends emails here
      - "8025:8025" # Web UI — open http://localhost:8025 to view sent emails

volumes:
  postgres_data: